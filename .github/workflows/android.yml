name: Carplex Android APK
on:
  push:
    paths:
      - 'lib/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - '.github/workflows/android.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate Android scaffold
        run: |
          flutter create --platforms=android --org app.carplex.preview --project-name carplex "$RUNNER_TEMP/carplex"
          cp -R "$RUNNER_TEMP/carplex/android" .
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp "assets/$density.png" "android/app/src/main/res/mipmap-$density/ic_launcher.png"
          done
          python - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          p.write_text(p.read_text().replace('android:label="carplex"', 'android:label="کارپلکس آزمایشی"'))
          p.write_text(p.read_text().replace('<application', '<uses-permission android:name="android.permission.INTERNET" />\n    <application', 1))
          PY
      - run: flutter pub get
      - name: Build test APK
        env:
          CARPLEX_API: ${{ vars.CARPLEX_API || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}
        run: flutter build apk --debug --dart-define="CARPLEX_API=$CARPLEX_API"
      - uses: actions/upload-artifact@v4
        with:
          name: carplex-test-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
